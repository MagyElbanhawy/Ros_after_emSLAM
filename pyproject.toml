[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bacs-sim"
version = "0.1.0"
description = "Bandwidth-Aware Constraint Scheduling simulator for trust-weighted multi-robot map fusion over duty-cycle-limited wireless links."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = [
    "multi-robot SLAM",
    "constraint scheduling",
    "duty cycle",
    "LoRa",
    "information gain",
    "trust weighting",
    "ROS 2",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/magyelbanhawy/ros_after_emslam"

[tool.setuptools]
packages = ["bacs_sim"]
